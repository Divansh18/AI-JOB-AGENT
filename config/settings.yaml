timezone: Asia/Kolkata
db_path: data/jobsearch.db
digest_dir: data/digests

http:
  timeout_seconds: 20
  max_retries: 3
  requests_per_second: 3.0
  user_agent: "jobsearch-personal/0.1"

llm:
  # Optional LLM Application Intelligence.
  enabled: true

  # Supported providers:
  #   claude_cli -> local Claude CLI runtime
  #   anthropic  -> requires ANTHROPIC_API_KEY
  #   openai     -> requires OPENAI_API_KEY
  provider: openai

  model: gpt-4.1-mini

  # Cost controls
  daily_cap_inr: 15.0
  monthly_cap_inr: 500.0
  per_call_cap_inr: 25.0
  usd_to_inr: 88.0

  # Context/output limits
  max_jd_chars: 6000
  max_input_chars: 16000
  max_output_tokens: 1024

  # Prompt/cache versions
  prompt_version: application_intelligence_v1
  answer_prompt_version: application_answer_drafting_v1
  resume_wording_prompt_version: resume_wording_v2

  # Provider timeouts
  cli_timeout_seconds: 120
  api_timeout_seconds: 60

digest:
  top_n: 20
  aging_min_score: 70
  aging_days: 10
  followup_days: 7
