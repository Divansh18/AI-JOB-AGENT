# Ranking weights. Re-ranking is free (local recompute over stored
# embeddings), so tuning these is cheap and reversible:
#   jobsearch rank --rerun

version: 1

weights:
  semantic: 40      # percentile-normalised cosine, profile vs JD
  title: 20         # role tier match
  freshness: 15     # exponential decay on first_seen/posted
  location: 10      # preferred city > India remote > global remote
  skills: 10        # deterministic dictionary match
  priority: 5       # company priority from companies.yaml

# Applied after the weighted sum. These encode the graded YOE policy.
yoe_adjustments:
  strong: 4.0       # 0-2 years required
  ok: 0.0           # <=3 years preferred
  unknown: 0.0      # nothing stated
  penalty: -8.0     # 3 years required
  soft_high: -15.0  # 4+ years preferred but not required

employment_adjustments:
  full_time: 0.0
  internship: -12.0
  part_time: -10.0
  unknown: -2.0

early_career_title_bonus: 5.0
freshness_halflife_hours: 96
familiar_skill_weight: 0.35     # a developing skill counts ~1/3 of a core one
semantic_percentile_normalize: true
