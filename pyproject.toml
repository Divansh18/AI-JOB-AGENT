[project]
name = "jobsearch"
version = "0.1.0"
description = "Personal job discovery, ranking and application ledger"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "Jinja2>=3.1",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "selectolax>=0.3.21",
    "pypdf>=5.0",
    "playwright>=1.47",
    "openai>=1.99",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "import-linter>=2.0"]

[project.scripts]
jobsearch = "jobsearch.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.importlinter]
root_package = "jobsearch"

[[tool.importlinter.contracts]]
name = "Layered architecture (cli/render -> services -> domain/persistence)"
type = "layers"
layers = ["jobsearch.cli", "jobsearch.services", "jobsearch.persistence", "jobsearch.domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain layer is independent of infrastructure"
type = "forbidden"
source_modules = ["jobsearch.domain"]
forbidden_modules = [
    "jobsearch.services", "jobsearch.persistence", "jobsearch.sources",
    "jobsearch.cli", "jobsearch.render", "jobsearch.llm",
]

[[tool.importlinter.contracts]]
name = "Deterministic pipeline does not depend on the LLM layer"
type = "forbidden"
source_modules = ["jobsearch.services.pipeline", "jobsearch.services.digest"]
forbidden_modules = ["jobsearch.llm"]

[[tool.importlinter.contracts]]
name = "Concrete LLM providers are reached only through the provider factory"
type = "forbidden"
source_modules = [
    "jobsearch.domain", "jobsearch.services", "jobsearch.sources",
    "jobsearch.persistence", "jobsearch.render",
]
forbidden_modules = [
    "jobsearch.llm.claude_cli",
    "jobsearch.llm.anthropic_provider",
    "jobsearch.llm.openai_provider",
]
